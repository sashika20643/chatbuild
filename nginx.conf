server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never serve dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Logto magic-link OIDC callback -> serve the auth SPA without changing the URL
    location = /callback {
        try_files /auth/magic-link/index.html =404;
    }

    # SPA fallback for any deep link under /auth/magic-link/
    location /auth/magic-link/ {
        try_files $uri $uri/ /auth/magic-link/index.html;
    }

    # Everything else: serve the file if it exists, otherwise 404
    location / {
        try_files $uri $uri/ =404;
    }
}
